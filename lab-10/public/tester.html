<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Request tester</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 28px auto; padding: 0 16px; }
  .row { display: flex; gap: 8px; margin: 10px 0; }
  select, input, textarea, button { font: inherit; padding: 8px 10px; box-sizing: border-box; }
  input, textarea { flex: 1; width: 100%; font-family: ui-monospace, monospace; }
  button { background: #1d4ed8; color: #fff; border: 0; border-radius: 8px; }
  pre { background: #f1f5f9; padding: 12px; border-radius: 8px; white-space: pre-wrap; min-height: 60px; }
  b.s { font-size: 22px; }
</style>
</head>
<body>
<h1>Request tester</h1>
<p>Choose the kind of request, type the address, and for POST the JSON to send. Press Send.</p>
<div class="row">
  <select id="method"><option>GET</option><option>POST</option><option>DELETE</option></select>
  <input id="path" value="/books">
  <button id="go" type="button">Send</button>
</div>
<textarea id="body" rows="3" placeholder='for POST, for example: { "title": "Ignited Minds" }'></textarea>
<p>Status: <b class="s" id="status">-</b></p>
<pre id="out"></pre>
<script>
document.getElementById("go").addEventListener("click", function ()
{
  var method = document.getElementById("method").value;
  var text = document.getElementById("body").value.trim();
  var request = new XMLHttpRequest();
  request.open(method, document.getElementById("path").value);
  request.onload = function ()
  {
    document.getElementById("status").textContent = request.status;
    document.getElementById("out").textContent = request.responseText;
  };
  if (method === "POST" && text)
  {
    request.setRequestHeader("Content-Type", "application/json");
    request.send(text);
  }
  else
  {
    request.send();
  }
});
</script>
</body>
</html>
