<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Register for the helpdesk</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 32px auto; padding: 0 16px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input, select, button { font: inherit; padding: 8px 10px; width: 100%; box-sizing: border-box; }
  button { margin-top: 18px; background: #3f7d33; color: #fff; border: 0; border-radius: 8px; }
</style>
</head>
<body>
<h1>Register for the helpdesk</h1>
<form method="post" action="/register">
  <label for="email">College email</label>
  <input id="email" name="email" type="email">
  <label for="password">Password</label>
  <input id="password" name="password" type="password">
  <label for="course">Course</label>
  <select id="course" name="course">
    <option value="">Choose a course</option>
    <option value="CSE">CSE</option>
    <option value="IT">IT</option>
    <option value="ECE">ECE</option>
  </select>
  <button type="submit">Register</button>
</form>
<p><a href="/login.html">Already registered? Log in</a></p>
</body>
</html>
